<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B5163">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Broll FM</title>
<style>
:root{
  --ground:#F6F8F9; --surface:#FFFFFF; --surface-2:#EEF2F4;
  --ink:#101A1E; --ink-2:#35494F; --muted:#63797F;
  --rule:#DEE6E9; --rule-strong:#C2CFD4;
  --accent:#1B5163; --accent-ink:#0F3A47; --accent-soft:#E4EDF0;
  --ok:#2C7A52; --warn:#A9760F; --crit:#AE4126;
  --ok-bg:#E5F1EA; --warn-bg:#F8EFD9; --crit-bg:#F8E8E3;
  --f-d:"Archivo","Segoe UI",system-ui,Arial,sans-serif;
  --f-b:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --ground:#0C1416; --surface:#131F23; --surface-2:#1A282C;
  --ink:#E8EFF1; --ink-2:#BCCBD1; --muted:#8EA5AC;
  --rule:#243539; --rule-strong:#35494F;
  --accent:#6FB6CC; --accent-soft:#162E36;
  --ok:#62C091; --warn:#DBAE4E; --crit:#E2836D;
  --ok-bg:#122720; --warn-bg:#2B2414; --crit-bg:#2B1A13;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-b);
  font-size:16px;line-height:1.45;display:flex;flex-direction:column;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}

header.app{background:var(--accent);color:#F3F9FB;padding:calc(env(safe-area-inset-top) + .6rem) .9rem .75rem;
  display:flex;align-items:center;gap:.6rem;flex:none}
header.app .t{font-family:var(--f-d);font-weight:700;font-size:1.02rem;flex:1;line-height:1.15;min-width:0}
header.app .t small{display:block;font-family:var(--f-m);font-size:.6rem;opacity:.8;font-weight:400;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#F3F9FB;min-width:34px;height:34px;border-radius:17px;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;padding:0 .5rem}
.net{font-family:var(--f-m);font-size:.58rem;padding:.2rem .42rem;border-radius:3px;background:rgba(255,255,255,.18);letter-spacing:.05em;border:0;color:inherit;cursor:pointer}
.net.off{background:var(--warn);color:#231A00}

main{flex:1;overflow-y:auto;padding:.85rem .85rem 1.2rem;-webkit-overflow-scrolling:touch}
.scr{display:none}.scr.on{display:block;animation:fade .16s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr.on{animation:none}}
h2{font-family:var(--f-d);font-size:1.02rem;margin:.1rem 0 .15rem}
.sub{font-size:.78rem;color:var(--muted);margin:0 0 .85rem}
.lbl{font-family:var(--f-m);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .4rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.85rem .9rem;margin-bottom:.6rem}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.28rem 0;font-size:.85rem}
.row b{font-family:var(--f-m);font-variant-numeric:tabular-nums;font-weight:600}
.mut{color:var(--muted)}
.chip{display:inline-block;font-family:var(--f-m);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;padding:.14rem .4rem;border-radius:3px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}.chip.mut{background:var(--surface-2);color:var(--muted)}

.tile{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.8rem .85rem;
  text-align:left;cursor:pointer;display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.tile:active{background:var(--surface-2)}
.tile .g{width:40px;height:40px;border-radius:20px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:1.15rem;flex:none;font-weight:600}
.tile .n{font-weight:600;font-size:.92rem}
.tile .d{font-size:.73rem;color:var(--muted)}
.tile .chev{color:var(--rule-strong);font-size:1.2rem;margin-left:auto}

.itemrow{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-bottom:1px solid var(--rule);
  cursor:pointer;background:var(--surface);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.itemrow:last-child{border-bottom:0}
.itemrow:active{background:var(--surface-2)}
.itemrow .nm{flex:1;min-width:0}
.itemrow .nm b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemrow .nm span{font-size:.7rem;color:var(--muted);font-family:var(--f-m)}
.itemrow .bal{text-align:right;flex:none;min-width:72px;white-space:nowrap}
.itemrow .bal b{font-family:var(--f-m);font-size:1.05rem;font-variant-numeric:tabular-nums}
.itemrow .bal span{font-size:.68rem;color:var(--muted);margin-left:.15rem}
.itemrow .chip{flex:none;min-width:74px;text-align:center}

.qtybar{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.5rem 0 .7rem}
.qtybar button{width:52px;height:52px;border-radius:26px;border:1px solid var(--rule-strong);background:var(--surface);font-size:1.5rem;cursor:pointer}
.qtybar input{width:120px;text-align:center;font-family:var(--f-m);font-size:2.1rem;font-weight:700;
  border:0;background:transparent;border-bottom:2px solid var(--accent);padding:.1rem 0;min-width:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.7rem}
.pad button{padding:.75rem 0;border:1px solid var(--rule);background:var(--surface);border-radius:6px;
  font-family:var(--f-m);font-size:1.05rem;cursor:pointer}
.pad button:active{background:var(--accent-soft)}

.btn{width:100%;padding:.85rem;border:0;border-radius:6px;background:var(--accent);color:#F3F9FB;
  font-family:var(--f-d);font-weight:600;font-size:.95rem;cursor:pointer;margin-bottom:.5rem}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong)}
.btn.danger{background:var(--crit)}
.btn:disabled{opacity:.45}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.btn2 .btn{margin-bottom:0}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem .2rem;border-bottom:1px solid var(--rule);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--rule-strong);flex:none;
  display:grid;place-items:center;font-size:.9rem;color:transparent;margin-top:1px}
.chk.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .txt{flex:1;font-size:.87rem;line-height:1.35}
.chk .txt small{display:block;font-family:var(--f-m);font-size:.64rem;color:var(--muted);margin-top:.1rem}
.chk.done .txt{color:var(--muted)}

.hist{font-size:.78rem;border-top:1px solid var(--rule);padding:.5rem 0;display:flex;gap:.6rem;align-items:baseline}
.hist:first-of-type{border-top:0}
.hist .w{width:52px;font-family:var(--f-m);font-size:.68rem;color:var(--muted);flex:none}
.hist .q{margin-left:auto;font-family:var(--f-m);font-weight:600}
.hist .q.in{color:var(--ok)} .hist .q.out{color:var(--crit)}

.field{margin-bottom:.7rem}
.field label{display:block;font-family:var(--f-m);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.field input,.field select,.field textarea{width:100%;padding:.7rem .75rem;border:1px solid var(--rule-strong);
  border-radius:6px;background:var(--surface);font-size:1rem}
.field textarea{min-height:74px;resize:vertical;font-family:inherit}

.bars{display:flex;flex-direction:column;gap:.5rem}
.barrow{display:grid;grid-template-columns:1fr auto;gap:.3rem .6rem;align-items:center}
.barrow .k{font-size:.8rem}
.barrow .v{font-family:var(--f-m);font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600}
.barrow .t{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.barrow .t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.spark{width:100%;height:56px;display:block}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;margin-bottom:.8rem}
.seg button{flex:1;padding:.5rem 0;border:0;background:var(--surface);font-family:var(--f-m);font-size:.68rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#F3F9FB}

.thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0 0}
.thumb{position:relative;width:76px;height:76px;border-radius:5px;overflow:hidden;border:1px solid var(--rule-strong)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:3px;background:rgba(0,0,0,.62);color:#fff;font-size:.7rem;padding:.1rem .3rem;cursor:pointer}

/* the account sheet — reached by tapping your own name in the header */
header.app .who-btn{border:0;background:transparent;color:inherit;text-align:left;padding:0;
  cursor:pointer;font:inherit;font-family:var(--f-d);font-weight:700;font-size:1.02rem;
  flex:1;line-height:1.15;min-width:0}
header.app .who-btn small{display:block;font-family:var(--f-m);font-size:.6rem;opacity:.8;
  font-weight:400;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
header.app .who-btn small::after{content:" ▾";opacity:.75}
#sheet{position:fixed;inset:0;z-index:55;background:rgba(8,20,24,.42);
  display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#sheet .panel{background:var(--surface);width:100%;border-radius:14px 14px 0 0;
  padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(8,20,24,.28)}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--rule-strong);
  margin:-.35rem auto .9rem}
#sheet .idrow{display:flex;gap:.8rem;align-items:center;margin-bottom:.5rem}
#sheet .idrow .av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;
  place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
#sheet .idrow b{display:block;font-size:1.02rem}
#sheet .idrow span{display:block;font-size:.75rem;color:var(--muted)}
#sheet .meta{font-size:.78rem;color:var(--muted);border-top:1px solid var(--rule);
  padding-top:.6rem;margin:.6rem 0 .9rem;line-height:1.5}
#sheet .btn{margin-bottom:.5rem}

/* sign-in / lock screen */
#lock{position:fixed;inset:0;z-index:60;background:var(--ground);display:none;
  flex-direction:column;overflow:auto;padding:0 1rem 2rem}
#lock.on{display:flex}
#lock .brand{padding:2.2rem 0 1.1rem;text-align:center}
#lock .brand b{display:block;font-size:1.32rem;letter-spacing:-.01em}
#lock .brand span{font-family:var(--f-m);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}
#lock h3{font-size:.95rem;margin:.2rem 0 .1rem}
#lock .who{width:100%;display:flex;align-items:center;gap:.75rem;text-align:left;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  padding:.75rem .85rem;margin-bottom:.5rem;cursor:pointer;font:inherit;color:var(--ink)}
#lock .who:active{background:var(--surface-2)}
#lock .who .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:.86rem}
#lock .who .nm{flex:1;min-width:0}
#lock .who .nm b{display:block;font-size:.95rem}
#lock .who .nm span{display:block;font-size:.72rem;color:var(--muted)}
#lock .pinbox{text-align:center;padding-top:.4rem}
#lock .dots{display:flex;gap:.7rem;justify-content:center;margin:1rem 0 1.3rem}
#lock .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--rule-strong);display:block}
#lock .dots i.f{background:var(--accent);border-color:var(--accent)}
#lock .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;max-width:290px;margin:0 auto}
#lock .pad button{font:inherit;font-size:1.4rem;padding:.72rem 0;border:1px solid var(--rule);
  border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
#lock .pad button:active{background:var(--accent-soft)}
#lock .pad button.sm{font-size:.8rem;color:var(--muted)}
#lock .err{color:var(--crit);font-size:.84rem;min-height:1.3em;margin:.8rem 0 0}
#lock .foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:1.6rem;line-height:1.5}
nav.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--rule);flex:none;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{flex:1;padding:.5rem 0 .55rem;border:0;background:transparent;font-size:.63rem;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav.tabbar button .i{font-size:1.15rem;line-height:1}
nav.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--ground);font-size:.8rem;padding:.6rem .9rem;border-radius:6px;opacity:0;
  transition:opacity .18s;pointer-events:none;max-width:90%;text-align:center;z-index:60}
.toast.on{opacity:.96}
.empty{text-align:center;color:var(--muted);font-size:.83rem;padding:2rem .8rem}
.note{font-family:var(--f-m);font-size:.62rem;color:var(--muted);text-align:center;padding:.7rem .4rem;line-height:1.6}
</style>
</head>
<body>

<header class="app">
  <button class="iconbtn" id="back" hidden>‹</button>
  <button class="t who-btn" id="title">Broll FM<small id="sub">Loading…</small></button>
  <button class="net" id="net">ONLINE</button>
  <button class="iconbtn" id="themebtn" title="Light / dark">◐</button>
</header>

<div id="lock" class="on"></div>
<div id="sheet" hidden></div>

<main id="main">
  <!-- HOME -->
  <div class="scr on" id="s-home"></div>
  <!-- STOCK LIST -->
  <div class="scr" id="s-stock"></div>
  <!-- ITEM -->
  <div class="scr" id="s-item"></div>
  <!-- MOVE (in/out) -->
  <div class="scr" id="s-move"></div>
  <!-- ROUNDS -->
  <div class="scr" id="s-rounds"></div>
  <!-- ROUND DETAIL -->
  <div class="scr" id="s-round"></div>
  <!-- READINGS -->
  <div class="scr" id="s-readings"></div>
  <!-- READING ENTRY -->
  <div class="scr" id="s-reading"></div>
  <!-- USAGE -->
  <div class="scr" id="s-usage"></div>
  <!-- SETTINGS / SYNC -->
  <div class="scr" id="s-settings"></div>
</main>

<nav class="tabbar">
  <button data-tab="home" aria-current="true"><span class="i">⌂</span>Home</button>
  <button data-tab="stock"><span class="i">▤</span>Store</button>
  <button data-tab="rounds"><span class="i">✓</span>Rounds</button>
  <button data-tab="usage"><span class="i">▁▄▆</span>Usage</button>
  <button data-tab="settings"><span class="i">⚙</span>Sync</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   Broll FM — capture app.
   Works with no server: everything is kept on this phone and can be
   pushed to the database later. Same file works offline, installed,
   or opened straight from a file.
   =================================================================== */
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=1)=>Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:d});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
const hhmm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dstr=t=>new Date(t).toISOString().slice(0,10);

/* ---------- storage: localStorage, with a safe in-memory fallback ---------- */
const mem={};
const store={
  get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){ return k in mem?mem[k]:d; } },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){ mem[k]=v; } }
};

/* ---------- seed: the real catalogue, starting balances from the 2024 cards ---------- */
/* ===================================================================
   WHO IS USING THIS PHONE.

   Three things decide what a person sees, and they are independent:
     rank   — what you may DO        (field < supervisor < manager < admin)
     scope  — which service lines you may SEE
     shift  — which team, for the roster
   Same shape as app_user + user_service_line in schema.sql, so this
   list is replaced by a fetch from the server and nothing else changes.

   THE PIN IS NOT SECURITY, AND MUST NOT BE TREATED AS IF IT WERE.
   It is here so that two cleaners sharing a site phone cannot file work
   under each other's names by accident, which is the realistic failure.
   Anyone who opens this file can read every PIN. On the real server the
   PIN is checked in Postgres and never travels to the phone — this array
   is replaced by a login call. Until then, do not put anything on this
   device that matters if the device is lost.
   =================================================================== */
const ACCOUNTS=[
 {id:'joe',   n:'Akuze',         pin:'1379', role:'admin',      team:'—',                     lines:'*'},
 {id:'dennis',n:'Dennis',        pin:'2468', role:'manager',    team:'—',                     lines:'*'},
 {id:'sup',   n:'FM Supervisor', pin:'1111', role:'supervisor', team:'Technical',             lines:'*'},
 {id:'ruth',  n:'Ruth Nakimuli', pin:'1234', role:'field',      team:'Cleaning — day shift',  lines:['cleaning','toiletries']},
 {id:'grace', n:'Grace Atim',    pin:'2345', role:'field',      team:'Cleaning — night shift',lines:['cleaning','toiletries']},
 {id:'musa',  n:'Musa Kigongo',  pin:'3456', role:'field',      team:'Technical',             lines:['general_fm','utilities','lifts']},
 {id:'peter', n:'Peter Odong',   pin:'4567', role:'field',      team:'Grounds and gardens',   lines:['gardening','domestic_waste']}
];
/* Whether the camera appears at all is a SETTING, not a code branch —
   photo_policy in the schema, one row per record type. Mirrored here so
   the phone knows before it has a server. A receipt is `required`
   because the photograph IS the record: a delivery note nobody can
   produce is a delivery nobody can defend. An issue is `off` because an
   hourly round photographed by six cleaners across a 13-hour shift is
   thousands of images a month. */
const PHOTO_POLICY={ IN:{req:'required',max:3}, OUT:{req:'off',max:0}, ADJ:{req:'optional',max:2} };

const ROLE_WORD={field:'Field',supervisor:'Supervisor',manager:'Manager',admin:'Admin'};
const LINE_WORD={cleaning:'Cleaning',toiletries:'Toiletries',gardening:'Gardening',
  domestic_waste:'Waste',utilities:'Utilities',lifts:'Lifts',general_fm:'General FM'};
const RANKS=['field','supervisor','manager','admin'];
const atLeast=r=>RANKS.indexOf(me().role)>=RANKS.indexOf(r);

const SEED_ITEMS=[
 {c:'DM001',n:'Flush Out Toilet Cleaner',u:'PC', b:10,  min:1,ln:'cleaning'},
 {c:'DM002',n:'Dish Washing Liquid',     u:'L',  b:0,   min:2,ln:'cleaning'},
 {c:'DM003',n:'Disinfectant Block Air Freshener',u:'BTL',b:14,min:3,ln:'cleaning'},
 {c:'DM004',n:'Air Freshener Spray 300ml',u:'BTL',b:5,  min:2,ln:'cleaning'},
 {c:'DM005',n:'Interleaves',             u:'CTN',b:127.5,min:1,ln:'toiletries'},
 {c:'DM006',n:'Maxi Roll, 2-Ply',        u:'CTN',b:16,  min:2,ln:'toiletries'},
 {c:'DM007',n:'Toilet Seat Cover',       u:'CTN',b:17,  min:2,ln:'toiletries'},
 {c:'DM008',n:'Hand Wash Gel',           u:'BTL',b:10,  min:2,ln:'toiletries'},
 {c:'DM009',n:'Jik',                     u:'BTL',b:19,  min:2,ln:'cleaning'},
 {c:'DM010',n:'Toilet Paper Roll, 2-Ply',u:'PC', b:0,   min:2,ln:'toiletries'},
 {c:'DM011',n:'Toilet Cleaner Harpic 500ml',u:'BTL',b:38,min:2,ln:'cleaning'},
 {c:'DM012',n:'Air Freshener for Auto Sprays',u:'BTL',b:0,min:1,ln:'cleaning'},
 {c:'DM013',n:'Toilet Rim Block',        u:'PC', b:34,  min:1,ln:'cleaning'},
 {c:'DM014',n:'Disinfectant Liquid, Dettol 500ml',u:'BTL',b:1,min:1,ln:'cleaning'},
 {c:'DM015',n:'Auto Air Freshener Dispensers',u:'PC',b:1,min:1,ln:'cleaning'},
 {c:'DM016',n:'Hand Wash Dispensers',    u:'PC', b:3,   min:1,ln:'toiletries'},
 {c:'DM017',n:'Sanitizer (litres)',      u:'L',  b:5,   min:1,ln:'toiletries'},

/* ---------- state ---------- */
let S = {
  items:   store.get('broll.items', null),
  txns:    store.get('broll.txns', []),
  rounds:  store.get('broll.rounds', []),
  readings:store.get('broll.readings', []),
  cfg:     store.get('broll.cfg', {theme:'light', server:'', token:'', online:true}),
  ses:     store.get('broll.ses', null)          // {id, at} — who is signed in
};
if(!S.items){
  S.items = SEED_ITEMS.map(i=>({code:i.c,name:i.n,uom:i.u,opening:i.b,min:i.min}));
  // opening balances become real receipts, so the ledger explains every unit
  S.txns = S.items.filter(i=>i.opening>0).map(i=>({
    id:uid(), ts:new Date(Date.now()-86400000).toISOString(), item:i.code, dir:'IN',
    qty:i.opening, note:'Opening balance carried from the stock cards', who:'system', synced:true
  }));

function save(){ store.set('broll.items',S.items); store.set('broll.txns',S.txns);
  store.set('broll.rounds',S.rounds); store.set('broll.readings',S.readings);
  store.set('broll.cfg',S.cfg); store.set('broll.ses',S.ses); }

/* ---------- who is signed in, and what they may see ----------
   A phone left on a windowsill signs itself out. Eight hours is a shift:
   long enough that nobody is re-entering a PIN mid-round, short enough
   that the next shift cannot file work under the last shift's name. */
const SHIFT_MS = 8*60*60*1000;
function me(){
  if(!S.ses) return null;
  if(Date.now() - S.ses.at > SHIFT_MS){ S.ses=null; save(); return null; }
  return ACCOUNTS.find(a=>a.id===S.ses.id) || null;
}
function touchSession(){ if(S.ses){ S.ses.at=Date.now(); store.set('broll.ses',S.ses); } }
function seesLine(ln){
  const u=me(); if(!u) return false;
  return u.lines==='*' || u.lines.indexOf(ln)>=0;
}
function myItems(){  return S.items.filter(i=>seesLine(i.ln||'cleaning')); }
function myRounds(){ return SEED_ROUNDS.filter(r=>seesLine(r.ln||'cleaning')); }
function myLinesWords(){
  const u=me(); if(!u) return '';
  return u.lines==='*' ? 'All service lines'
       : u.lines.map(l=>LINE_WORD[l]||l).join(' · ');
}

/* ---------- the one rule that matters: balance is DERIVED ---------- */
function balance(code){
  return S.txns.filter(t=>t.item===code)
    .reduce((n,t)=> n + (t.dir==='OUT' ? -Number(t.qty) : Number(t.qty)), 0);
}
function movedToday(code,dir){
  const d=dstr(now());
  return S.txns.filter(t=>t.item===code && t.dir===dir && dstr(t.ts)===d)
               .reduce((n,t)=>n+Number(t.qty),0);
}
function avgDaily(code){
  const outs=S.txns.filter(t=>t.item===code && t.dir==='OUT');
  if(!outs.length) return 0;
  const days=new Set(outs.map(t=>dstr(t.ts))).size || 1;
  return outs.reduce((n,t)=>n+Number(t.qty),0)/days;
}
function itemStatus(it){
  const b=balance(it.code), a=avgDaily(it.code);
  const cover = a>0 ? b/a : null;
  if(b<=0) return {cls:'crit',word:'Out of stock',cover};
  if(b<=it.min) return {cls:'crit',word:'At minimum',cover};
  if(cover!=null && cover<7) return {cls:'warn',word:'Low',cover};
  return {cls:'ok',word:'OK',cover};
}
function addTxn(code,dir,qty,note){
  const t={id:uid(),ts:now(),item:code,dir,qty:Number(qty),note:note||'',
           who:me().n,by:me().id,synced:false};
  S.txns.push(t); save(); return t;
}

}

/* ---------- sign in ----------
   A LIST OF NAMES IS NOT A LOGIN, and it is worth being clear about the
   difference. Tapping a name is a claim, not proof — without something
   only that person knows, anyone can file a stock issue or a completed
   round under a colleague's name, which is strictly worse than a shared
   login because it puts a false author in the audit trail rather than
   an ambiguous one. The whole reason every member of staff gets an
   account is so that "who did this" has an answer. So: pick a name,
   then a PIN. Four digits, because a password typed on a phone keypad
   in a washroom at 06:00 will not happen, and a control nobody uses
   protects nobody.
*/
let pinFor=null, pinBuf='';
function showLock(){
  pinFor=null; pinBuf='';
  $('#lock').classList.add('on');
  paintLock();
}
function paintLock(){
  const L=$('#lock');
  if(!pinFor){
    L.innerHTML=`
    <div class="brand"><b>Broll FM</b><span>World Bank · Kampala</span></div>
    <h3>Who is using this phone?</h3>
    <p class="sub" style="margin:.1rem 0 .9rem">Everything you record is filed under the name you choose, so choose your own.</p>
    ${ACCOUNTS.map(a=>`
      <button class="who" data-acc="${a.id}">
        <span class="av">${esc(a.n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>
        <span class="nm"><b>${esc(a.n)}</b>
          <span>${ROLE_WORD[a.role]} · ${a.lines==='*'?'all service lines':a.lines.map(l=>LINE_WORD[l]||l).join(', ')}</span></span>
        <span class="mut" style="font-size:1.1rem">›</span>
      </button>`).join('')}
    <p class="foot">Not on the list? An admin adds you in <b>Users &amp; access</b> on the dashboard.
      Nobody shares a login — the audit trail is most of what this system is for.</p>`;
    L.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{
      pinFor=ACCOUNTS.find(a=>a.id===b.dataset.acc); pinBuf=''; paintLock();
    });
  } else {
    L.innerHTML=`
    <div class="brand"><b>${esc(pinFor.n)}</b><span>${ROLE_WORD[pinFor.role]} · ${esc(pinFor.team)}</span></div>
    <div class="pinbox">
      <h3>Enter your PIN</h3>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
        <button class="sm" data-act="back">Not me</button>
        <button data-d="0">0</button>
        <button class="sm" data-act="del">Delete</button>
      </div>
      <p class="err" id="pinerr"></p>
    </div>`;
    L.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      if(pinBuf.length>=4) return;
      pinBuf+=b.dataset.d; paintLock();
      if(pinBuf.length===4) setTimeout(tryPin,120);
    });
    L.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      if(b.dataset.act==='back'){pinFor=null;pinBuf='';}
      else pinBuf=pinBuf.slice(0,-1);
      paintLock();
    });
  }
}
function tryPin(){
  if(pinBuf===pinFor.pin){
    S.ses={id:pinFor.id, at:Date.now()}; save();
    $('#lock').classList.remove('on');
    buildTabs(); stack=[]; go('home',{},false);
    toast('Signed in as ' + pinFor.n.split(' ')[0] + '.');
  } else {
    pinBuf='';
    paintLock();
    $('#pinerr').textContent='That PIN is not right. Try again.';
  }
}
/* ---------- photographs ----------
   Downscale on the phone, before anything is queued. Longest edge
   1600 px at JPEG 0.7 lands around 200-400 KB; a modern phone camera
   produces 4-8 MB. On a 12 GB server that difference is the difference
   between a system that runs for years and one that fills up in a
   quarter — and on a Kampala mobile connection it is the difference
   between a receipt that syncs and one that times out for ever. */
function shrinkPhoto(file,max){
  if(PHOTOS.length>=max) return toast('That is the most photographs this record takes.');
  const rd=new FileReader(), img=new Image();
  rd.onload=()=>{ img.onload=()=>{
    const c=document.createElement('canvas');
    const k=Math.min(1,1600/Math.max(img.width,img.height));
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',0.7);
    PHOTOS.push({url,kb:Math.round(url.length*0.75/1024)});
    paintThumbs();
  }; img.src=rd.result; };
  rd.readAsDataURL(file);
}
function paintThumbs(){
  const t=$('#thumbs'); if(!t) return;
  t.innerHTML=PHOTOS.map((p,i)=>`<div class="thumb"><img src="${p.url}" alt=""><button data-rm="${i}">×</button></div>`).join('');
  t.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{PHOTOS.splice(+b.dataset.rm,1);paintThumbs();});
  const sh=$('#shrink');
  if(sh && PHOTOS.length) sh.textContent =
    PHOTOS.length+' photograph'+(PHOTOS.length>1?'s':'')+', '+
    PHOTOS.reduce((n,p)=>n+p.kb,0)+' KB in total after resizing. They travel with the receipt.';
}

/* ---------- the account sheet ----------
   Sign out lived only at the bottom of the Sync tab, which is three taps
   away behind a word that means something else. A control nobody can
   find is a control that does not exist — and on a shared site phone,
   "I could not sign out so I just carried on as Ruth" is precisely the
   failure the PIN was added to prevent. It belongs where every phone
   app puts it: behind your own name, which is already in the header.
*/
function openSheet(){
  const u=me(); if(!u) return;
  const p=pending();
  $('#sheet').innerHTML=`

      ${p? `<b>${p} entr${p===1?'y is':'ies are'} still waiting to send.</b> They stay on this phone
            and go when it next syncs — signing out does not lose them.`
         : 'Everything recorded on this phone has been sent.'}
    </div>

}

/* ---------- the fourth tab, by rank ----------
   Reports are a MANAGER's screen and this is not squeamishness about
   hierarchy — it is what rank means here. `field` is defined in
   CLAUDE.md §7 as "records within their own service lines, sees their
   own entries, NEVER sees costs", and a report is precisely an
   estate-wide roll-up with money in it. Showing Ruth the consumables
   spend across gardening and lifts hands her figures she has no way to
   check, no authority to act on, and no business holding — and it
   quietly makes the scope column decorative.

   But "no reports" must not mean "nothing". Ruth has the strongest
   claim of anyone to see her own day: what she issued, whether her
   rounds are done, and whether the store will still have toilet paper
   at four o'clock. That is the screen that makes the app worth opening,
   and none of it is anybody else's business either.

   So the same tab renders three ways:
     field       My day  — her own entries, her rounds, her stock
     supervisor  Team    — everyone's rounds today, compliance, no money
     manager+    Reports — the estate-wide roll-up
*/
/* How many of a round should have happened BY NOW — not by the end of
   the day. Comparing against the full day's quota tells a cleaner at
   09:00 that she is "13 behind" on an hourly round, which is nonsense
   and is exactly the kind of figure that makes staff stop trusting the
   screen. Prorate against the shift elapsed so far. Same idea as
   v_task_due_now in the schema: due RIGHT NOW, not due eventually. */
const SHIFT_FROM=6, SHIFT_TO=19;          // 06:00–19:00, as seeded
function expectedSoFar(freqMin){
  const d=new Date();
  const mins=(d.getHours()+d.getMinutes()/60 - SHIFT_FROM)*60;
  const cap =(SHIFT_TO-SHIFT_FROM)*60;
  const el  = Math.max(0, Math.min(mins, cap));
  return Math.max(0, Math.floor(el/freqMin));
}
function expectedFullDay(freqMin){
  return Math.max(1, Math.round((SHIFT_TO-SHIFT_FROM)*60/freqMin));
}

  if(r==='supervisor') return vTeam();

function vUsage(){
  $('#title').firstChild.textContent='Usage';
  const g=ctx.gran||'day';
  const bkt=t=>{const d=new Date(t);
    if(g==='day') return dstr(t);
    if(g==='week'){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dstr(x);}
    return dstr(t).slice(0,7);};
  // consumption per item
  const per={}; S.txns.filter(t=>t.dir==='OUT').forEach(t=>{per[t.item]=(per[t.item]||0)+Number(t.qty);});
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=top.length?top[0][1]:1;
  // series over time
  const ser={}; S.txns.filter(t=>t.dir==='OUT').forEach(t=>{const k=bkt(t.ts);ser[k]=(ser[k]||0)+Number(t.qty);});
  const pts=Object.entries(ser).sort();
  // metric totals
  // A meter reading is a dial position, NOT a quantity. Consumption is the
  // difference between readings, so sum the deltas and ignore the baseline.
  // Adding 1,420 m3 of meter position to 48 m3 of usage is how a utilities
  // report ends up claiming the site drank a reservoir.
  const mt={};
  S.readings.forEach(r=>{
    const m=SEED_METRICS.find(x=>x.c===r.metric)||{};
    if(m.meter){ if(r.delta!=null && r.delta>0) mt[r.metric]=(mt[r.metric]||0)+r.delta; }
    else mt[r.metric]=(mt[r.metric]||0)+r.value;
  });
  const mLatest={}; S.readings.forEach(r=>{mLatest[r.metric]=r;});
  $('#s-usage').innerHTML=`
  <h2>What has been used</h2><p class="sub">Built from the same movements you record — nothing separate to fill in.</p>
  <div class="seg">${['day','week','month'].map(x=>
    `<button data-gran="${x}" aria-pressed="${g===x}">${x}</button>`).join('')}</div>
  ${pts.length?`<div class="card"><div class="row"><span class="mut">Issued per ${g}</span>
     <b>${nf(pts.reduce((n,p)=>n+p[1],0),1)} total</b></div>${spark(pts)}</div>`:''}
  <p class="lbl">Consumables issued</p>
  <div class="card">${top.length?`<div class="bars">${top.map(([c,v])=>`
    <div class="barrow"><span class="k">${esc(itemName(c))}</span><span class="v">${nf(v,1)} ${itemUom(c)}</span>
      <span class="t"><i style="width:${Math.max(3,100*v/max)}%"></i></span></div>`).join('')}</div>`
    :'<div class="empty">Nothing issued yet. Record an issue in the Store, or tick a restock line on a round.</div>'}</div>
  <p class="lbl">Utilities and measurements</p>
  <div class="card">${Object.keys(mLatest).length?Object.keys(mLatest).map(c=>{
      const m=SEED_METRICS.find(x=>x.c===c)||{};
      const used=mt[c];
      return `<div class="row"><span>${esc(metricName(c))}${m.meter?'<br><span class="mut" style="font-size:.68rem">meter now '+nf(mLatest[c].value,1)+' '+m.u+'</span>':''}</span>
        <b>${used==null?'<span class="mut" style="font-weight:400">baseline set</span>':nf(used,1)+' '+metricUom(c)}</b></div>`;
    }).join('')
    :'<div class="empty">No readings yet. Log water, electricity or waste from the Readings screen.</div>'}</div>
  <p class="note">Water usage appears here as soon as you log two meter readings —<br>consumption is the difference between them.</p>`;
  document.querySelectorAll('#s-usage [data-gran]').forEach(b=>
    b.addEventListener('click',()=>{ctx.gran=b.dataset.gran;vUsage();}));
  wire();
}
function spark(pts){
  const W=320,H=56,m=4;
  const max=Math.max(...pts.map(p=>p[1]))||1;
  const x=i=>m+(pts.length<2?W/2:i*(W-2*m)/(pts.length-1));
  const y=v=>H-m-(v/max)*(H-2*m);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Issued over time">
    <path d="${d}L${x(pts.length-1).toFixed(1)},${H-m}L${x(0).toFixed(1)},${H-m}Z" fill="var(--accent)" opacity=".14"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1][1]).toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

function vSettings(){
  $('#title').firstChild.textContent='Sync & settings';
  const p=pending();
  $('#s-settings').innerHTML=`
  <div class="card" style="border-left:3px solid var(--${p?'warn':'ok'})">
    <div class="row"><span class="mut">Waiting to send</span><b>${p}</b></div>
    <div class="row"><span class="mut">Movements held</span><b>${S.txns.filter(t=>!t.synced).length}</b></div>
    <div class="row"><span class="mut">Rounds held</span><b>${S.rounds.filter(r=>!r.synced).length}</b></div>
    <div class="row"><span class="mut">Readings held</span><b>${S.readings.filter(r=>!r.synced).length}</b></div>
  </div>
  <button class="btn" id="sync">Sync now</button>
  <p class="lbl">Server</p>
  <div class="field"><label>API address</label>
    <input id="srv" value="${esc(S.cfg.server)}" placeholder="https://your-server/rest"></div>
  <div class="field"><label>Access token</label>
    <input id="tok" value="${esc(S.cfg.token)}" placeholder="paste the token" type="password"></div>
  <button class="btn sec" id="savecfg">Save server settings</button>
  <p class="lbl">Signed in</p>
  <div class="card">
    <div class="row"><span class="mut">Name</span><b>${esc(me().n)}</b></div>
    <div class="row"><span class="mut">Rank</span><b>${ROLE_WORD[me().role]}</b></div>
    <div class="row"><span class="mut">Team</span><b>${esc(me().team)}</b></div>
    <div class="row"><span class="mut">Sees</span><b>${esc(myLinesWords())}</b></div>
  </div>
  <button class="btn sec" id="signout">Sign out</button>
  <p class="note" style="margin-top:-.2rem">Quicker: tap your name at the top of any screen.</p>
  <p class="note">Your name is not editable here, and that is deliberate — it is what every
  movement, round and reading you record is filed under. An admin changes rank and scope
  in <b>Users &amp; access</b> on the dashboard. The phone signs itself out after eight hours,
  so the next shift cannot file work under your name.</p>
  <p class="lbl">Data</p>
  <button class="btn sec" id="exp">Export everything as a file</button>
  <button class="btn danger" id="reset">Reset to opening balances</button>
  <p class="note">With no server set, everything stays on this phone and nothing is lost.<br>
  Add the address later and the queue sends itself.</p>`;
  $('#sync').addEventListener('click',doSync);
  $('#savecfg').addEventListener('click',()=>{S.cfg.server=$('#srv').value.trim();S.cfg.token=$('#tok').value.trim();save();toast('Server settings saved.');});
  $('#signout').addEventListener('click',()=>{
    const p=pending();
    if(p && !confirm(p+' entr'+(p===1?'y is':'ies are')+' still waiting to send. They stay on this phone and will go when it syncs. Sign out anyway?')) return;
    signOut();
  });
  $('#exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({items:S.items,txns:S.txns,rounds:S.rounds,readings:S.readings},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='broll-capture-'+dstr(now())+'.json';a.click();
    toast('Exported. Send it to yourself or import it into the system.');
  });
  $('#reset').addEventListener('click',()=>{
    if(!confirm('Delete every movement, round and reading on this phone and start again?')) return;
    try{['items','txns','rounds','readings'].forEach(k=>localStorage.removeItem('broll.'+k));}catch(e){}
    location.reload();
  });
  wire();
}

async function doSync(){
  const p=pending();
  if(!p) return toast('Nothing waiting.');
  if(!S.cfg.online) return toast('Offline. Nothing is lost — it is all on this phone.');
  if(!S.cfg.server){
    // no server yet: mark as sent locally so the demo reads true, and say so plainly
    S.txns.forEach(t=>t.synced=true); S.rounds.forEach(r=>r.synced=true); S.readings.forEach(r=>r.synced=true);
    save(); render();
    return toast(`${p} entries cleared locally. Set a server address to send them for real.`);
  }
  toast('Sending…');
  const H={'Content-Type':'application/json',Authorization:'Bearer '+S.cfg.token,
           Prefer:'resolution=ignore-duplicates'};
  let sent=0, failed=0;
  const post=async(path,body,mark)=>{
    try{ const r=await fetch(S.cfg.server.replace(/\/$/,'')+path,{method:'POST',headers:H,body:JSON.stringify(body)});
      if(r.ok||r.status===409){mark();sent++;} else failed++;
    }catch(e){failed++;}
  };
  for(const t of S.txns.filter(x=>!x.synced))
    await post('/stock_txn',{client_uuid:t.id,txn_ts:t.ts,direction:t.dir,qty:t.qty,
      note:t.note,source:'scan'},()=>t.synced=true);
  for(const r of S.rounds.filter(x=>!x.synced))
    await post('/task_log',{client_uuid:r.id,done_ts:r.ts,was_scanned:true,
      condition_score:r.score,issue_found:r.issue,source:'scan'},()=>r.synced=true);
  for(const r of S.readings.filter(x=>!x.synced))
    await post('/reading',{client_uuid:r.id,read_ts:r.ts,value:r.value,
      note:r.note,source:'manual'},()=>r.synced=true);
  save(); render();
  toast(failed?`${sent} sent, ${failed} could not send — they stay queued.`:`${sent} entries synced. No duplicates.`);
}

/* delegated click wiring for the generated markup */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>go('item',{code:b.dataset.item}));
  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>go('move',{code:ctx.code,dir:b.dataset.move}));
  document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>go('round',{code:b.dataset.round}));
  document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>go('reading',{metric:b.dataset.metric}));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{const p=stack.pop();p?go(p.id,p.ctx,false):go('home',{},false);});
}

window.addEventListener('online',()=>{S.cfg.online=true;save();$('#net').textContent='ONLINE';$('#net').classList.remove('off');});
$('#title').addEventListener('click',()=>{ if(me()) openSheet(); });
if(me()){ $('#lock').classList.remove('on'); buildTabs(); render(); }
else showLock();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{/* file:// or no HTTPS — app still works */});
}
