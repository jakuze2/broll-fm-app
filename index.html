<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B5163">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Broll FM</title>
<style>
:root{
  --ground:#F6F8F9; --surface:#FFFFFF; --surface-2:#EEF2F4;
  --ink:#101A1E; --ink-2:#35494F; --muted:#63797F;
  --rule:#DEE6E9; --rule-strong:#C2CFD4;
  --accent:#1B5163; --accent-ink:#0F3A47; --accent-soft:#E4EDF0;
  --ok:#2C7A52; --warn:#A9760F; --crit:#AE4126;
  --ok-bg:#E5F1EA; --warn-bg:#F8EFD9; --crit-bg:#F8E8E3;
  --f-d:"Archivo","Segoe UI",system-ui,Arial,sans-serif;
  --f-b:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --ground:#0C1416; --surface:#131F23; --surface-2:#1A282C;
  --ink:#E8EFF1; --ink-2:#BCCBD1; --muted:#8EA5AC;
  --rule:#243539; --rule-strong:#35494F;
  --accent:#6FB6CC; --accent-soft:#162E36;
  --ok:#62C091; --warn:#DBAE4E; --crit:#E2836D;
  --ok-bg:#122720; --warn-bg:#2B2414; --crit-bg:#2B1A13;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-b);
  font-size:16px;line-height:1.45;display:flex;flex-direction:column;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}

header.app{background:var(--accent);color:#F3F9FB;padding:calc(env(safe-area-inset-top) + .6rem) .9rem .75rem;
  display:flex;align-items:center;gap:.6rem;flex:none}
header.app .t{font-family:var(--f-d);font-weight:700;font-size:1.02rem;flex:1;line-height:1.15;min-width:0}
header.app .t small{display:block;font-family:var(--f-m);font-size:.6rem;opacity:.8;font-weight:400;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#F3F9FB;min-width:34px;height:34px;border-radius:17px;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;padding:0 .5rem}
.net{font-family:var(--f-m);font-size:.58rem;padding:.2rem .42rem;border-radius:3px;background:rgba(255,255,255,.18);letter-spacing:.05em;border:0;color:inherit;cursor:pointer}
.net.off{background:var(--warn);color:#231A00}

main{flex:1;overflow-y:auto;padding:.85rem .85rem 1.2rem;-webkit-overflow-scrolling:touch}
.scr{display:none}.scr.on{display:block;animation:fade .16s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr.on{animation:none}}
h2{font-family:var(--f-d);font-size:1.02rem;margin:.1rem 0 .15rem}
.sub{font-size:.78rem;color:var(--muted);margin:0 0 .85rem}
.lbl{font-family:var(--f-m);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .4rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.85rem .9rem;margin-bottom:.6rem}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.28rem 0;font-size:.85rem}
.row b{font-family:var(--f-m);font-variant-numeric:tabular-nums;font-weight:600}
.mut{color:var(--muted)}
.chip{display:inline-block;font-family:var(--f-m);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;padding:.14rem .4rem;border-radius:3px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}.chip.mut{background:var(--surface-2);color:var(--muted)}

.tile{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.8rem .85rem;
  text-align:left;cursor:pointer;display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.tile:active{background:var(--surface-2)}
.tile .g{width:40px;height:40px;border-radius:20px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:1.15rem;flex:none;font-weight:600}
.tile .n{font-weight:600;font-size:.92rem}
.tile .d{font-size:.73rem;color:var(--muted)}
.tile .chev{color:var(--rule-strong);font-size:1.2rem;margin-left:auto}

.itemrow{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-bottom:1px solid var(--rule);
  cursor:pointer;background:var(--surface);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.itemrow:last-child{border-bottom:0}
.itemrow:active{background:var(--surface-2)}
.itemrow .nm{flex:1;min-width:0}
.itemrow .nm b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemrow .nm span{font-size:.7rem;color:var(--muted);font-family:var(--f-m)}
.itemrow .bal{text-align:right;flex:none;min-width:72px;white-space:nowrap}
.itemrow .bal b{font-family:var(--f-m);font-size:1.05rem;font-variant-numeric:tabular-nums}
.itemrow .bal span{font-size:.68rem;color:var(--muted);margin-left:.15rem}
.itemrow .chip{flex:none;min-width:74px;text-align:center}

.qtybar{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.5rem 0 .7rem}
.qtybar button{width:52px;height:52px;border-radius:26px;border:1px solid var(--rule-strong);background:var(--surface);font-size:1.5rem;cursor:pointer}
.qtybar input{width:120px;text-align:center;font-family:var(--f-m);font-size:2.1rem;font-weight:700;
  border:0;background:transparent;border-bottom:2px solid var(--accent);padding:.1rem 0;min-width:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.7rem}
.pad button{padding:.75rem 0;border:1px solid var(--rule);background:var(--surface);border-radius:6px;
  font-family:var(--f-m);font-size:1.05rem;cursor:pointer}
.pad button:active{background:var(--accent-soft)}

.btn{width:100%;padding:.85rem;border:0;border-radius:6px;background:var(--accent);color:#F3F9FB;
  font-family:var(--f-d);font-weight:600;font-size:.95rem;cursor:pointer;margin-bottom:.5rem}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong)}
.btn.danger{background:var(--crit)}
.btn:disabled{opacity:.45}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.btn2 .btn{margin-bottom:0}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem .2rem;border-bottom:1px solid var(--rule);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--rule-strong);flex:none;
  display:grid;place-items:center;font-size:.9rem;color:transparent;margin-top:1px}
.chk.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .txt{flex:1;font-size:.87rem;line-height:1.35}
.chk .txt small{display:block;font-family:var(--f-m);font-size:.64rem;color:var(--muted);margin-top:.1rem}
.chk.done .txt{color:var(--muted)}

.hist{font-size:.78rem;border-top:1px solid var(--rule);padding:.5rem 0;display:flex;gap:.6rem;align-items:baseline}
.hist:first-of-type{border-top:0}
.hist .w{width:52px;font-family:var(--f-m);font-size:.68rem;color:var(--muted);flex:none}
.hist .q{margin-left:auto;font-family:var(--f-m);font-weight:600}
.hist .q.in{color:var(--ok)} .hist .q.out{color:var(--crit)}

.field{margin-bottom:.7rem}
.field label{display:block;font-family:var(--f-m);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.field input,.field select,.field textarea{width:100%;padding:.7rem .75rem;border:1px solid var(--rule-strong);
  border-radius:6px;background:var(--surface);font-size:1rem}
.field textarea{min-height:74px;resize:vertical;font-family:inherit}

.bars{display:flex;flex-direction:column;gap:.5rem}
.barrow{display:grid;grid-template-columns:1fr auto;gap:.3rem .6rem;align-items:center}
.barrow .k{font-size:.8rem}
.barrow .v{font-family:var(--f-m);font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600}
.barrow .t{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.barrow .t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.spark{width:100%;height:56px;display:block}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;margin-bottom:.8rem}
.seg button{flex:1;padding:.5rem 0;border:0;background:var(--surface);font-family:var(--f-m);font-size:.68rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#F3F9FB}

nav.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--rule);flex:none;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{flex:1;padding:.5rem 0 .55rem;border:0;background:transparent;font-size:.63rem;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav.tabbar button .i{font-size:1.15rem;line-height:1}
nav.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--ground);font-size:.8rem;padding:.6rem .9rem;border-radius:6px;opacity:0;
  transition:opacity .18s;pointer-events:none;max-width:90%;text-align:center;z-index:60}
.toast.on{opacity:.96}
.empty{text-align:center;color:var(--muted);font-size:.83rem;padding:2rem .8rem}
.note{font-family:var(--f-m);font-size:.62rem;color:var(--muted);text-align:center;padding:.7rem .4rem;line-height:1.6}
</style>
</head>
<body>

<header class="app">
  <button class="iconbtn" id="back" hidden>‹</button>
  <div class="t" id="title">Broll FM<small id="sub">Loading…</small></div>
  <button class="net" id="net">ONLINE</button>
  <button class="iconbtn" id="themebtn" title="Light / dark">◐</button>
</header>

<main id="main">
  <!-- HOME -->
  <div class="scr on" id="s-home"></div>
  <!-- STOCK LIST -->
  <div class="scr" id="s-stock"></div>
  <!-- ITEM -->
  <div class="scr" id="s-item"></div>
  <!-- MOVE (in/out) -->
  <div class="scr" id="s-move"></div>
  <!-- ROUNDS -->
  <div class="scr" id="s-rounds"></div>
  <!-- ROUND DETAIL -->
  <div class="scr" id="s-round"></div>
  <!-- READINGS -->
  <div class="scr" id="s-readings"></div>
  <!-- READING ENTRY -->
  <div class="scr" id="s-reading"></div>
  <!-- USAGE -->
  <div class="scr" id="s-usage"></div>
  <!-- SETTINGS / SYNC -->
  <div class="scr" id="s-settings"></div>
</main>

<nav class="tabbar">
  <button data-tab="home" aria-current="true"><span class="i">⌂</span>Home</button>
  <button data-tab="stock"><span class="i">▤</span>Store</button>
  <button data-tab="rounds"><span class="i">✓</span>Rounds</button>
  <button data-tab="usage"><span class="i">▁▄▆</span>Usage</button>
  <button data-tab="settings"><span class="i">⚙</span>Sync</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   Broll FM — capture app.
   Works with no server: everything is kept on this phone and can be
   pushed to the database later. Same file works offline, installed,
   or opened straight from a file.
   =================================================================== */
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=1)=>Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:d});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
const hhmm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dstr=t=>new Date(t).toISOString().slice(0,10);

/* ---------- storage: localStorage, with a safe in-memory fallback ---------- */
const mem={};
const store={
  get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){ return k in mem?mem[k]:d; } },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){ mem[k]=v; } }
};

/* ---------- seed: the real catalogue, starting balances from the 2024 cards ---------- */
const SEED_ITEMS=[
 {c:'DM001',n:'Flush Out Toilet Cleaner',u:'PC', b:10,  min:1},
 {c:'DM002',n:'Dish Washing Liquid',     u:'L',  b:0,   min:2},
 {c:'DM003',n:'Disinfectant Block Air Freshener',u:'BTL',b:14,min:3},
 {c:'DM004',n:'Air Freshener Spray 300ml',u:'BTL',b:5,  min:2},
 {c:'DM005',n:'Interleaves',             u:'CTN',b:127.5,min:1},
 {c:'DM006',n:'Maxi Roll, 2-Ply',        u:'CTN',b:16,  min:2},
 {c:'DM007',n:'Toilet Seat Cover',       u:'CTN',b:17,  min:2},
 {c:'DM008',n:'Hand Wash Gel',           u:'BTL',b:10,  min:2},
 {c:'DM009',n:'Jik',                     u:'BTL',b:19,  min:2},
 {c:'DM010',n:'Toilet Paper Roll, 2-Ply',u:'PC', b:0,   min:2},
 {c:'DM011',n:'Toilet Cleaner Harpic 500ml',u:'BTL',b:38,min:2},
 {c:'DM012',n:'Air Freshener for Auto Sprays',u:'BTL',b:0,min:1},
 {c:'DM013',n:'Toilet Rim Block',        u:'PC', b:34,  min:1},
 {c:'DM014',n:'Disinfectant Liquid, Dettol 500ml',u:'BTL',b:1,min:1},
 {c:'DM015',n:'Auto Air Freshener Dispensers',u:'PC',b:1,min:1},
 {c:'DM016',n:'Hand Wash Dispensers',    u:'PC', b:3,   min:1},
 {c:'DM017',n:'Sanitizer (litres)',      u:'L',  b:5,   min:1},
 {c:'DM018',n:'Sanitizer Bottles',       u:'BTL',b:23,  min:1},
 {c:'DM019',n:'Foam Soap',               u:'BTL',b:0,   min:1}
];
/* Rounds carry a checklist. A line with `use` records a stock issue when
   you tick it — which is how consumption actually gets captured. */
const SEED_ROUNDS=[
 {c:'CLN-WC-GF',n:'Ground floor washrooms',freq:60,list:[
   {t:'Bins emptied'},{t:'Floors swept and mopped'},{t:'Basins, taps and mirrors'},
   {t:'WC pans and seats'},{t:'Restock toilet paper',use:'DM010',q:6},
   {t:'Restock hand wash',use:'DM008',q:1},{t:'Restock interleaves',use:'DM005',q:0.5},
   {t:'Check for faults and leaks'}]},
 {c:'CLN-WC-1F',n:'First floor washrooms',freq:60,list:[
   {t:'Bins emptied'},{t:'Floors swept and mopped'},{t:'Basins, taps and mirrors'},
   {t:'WC pans and seats'},{t:'Restock toilet paper',use:'DM010',q:6},
   {t:'Restock hand wash',use:'DM008',q:1},{t:'Check for faults and leaks'}]},
 {c:'CLN-WC-2F',n:'Second floor washrooms',freq:60,list:[
   {t:'Bins emptied'},{t:'Floors swept and mopped'},{t:'Basins, taps and mirrors'},
   {t:'WC pans and seats'},{t:'Restock toilet paper',use:'DM010',q:6},
   {t:'Restock interleaves',use:'DM005',q:0.5},{t:'Check for faults and leaks'}]},
 {c:'CLN-LOBBY',n:'Main lobby sweep',freq:120,list:[
   {t:'Floors swept and mopped'},{t:'Glass and entrance doors'},{t:'Bins emptied'},
   {t:'Seating wiped down'}]},
 {c:'WST-BIN-RND',n:'Waste bin round',freq:240,list:[
   {t:'All bins collected'},{t:'Bins emptied — count them',read:'waste_bins_emptied'},
   {t:'Bin store swept'},{t:'Liners replaced',use:'DM009',q:1}]}
];
/* Measure what a person on site can actually COUNT. There is no
   weighbridge here, so a cleaner counts bins, not kilogrammes. Weight
   and cost come off the disposal contractor's monthly invoice. */
const SEED_METRICS=[
 {c:'waste_bins_emptied', n:'Bins emptied',          u:'bins'},
 {c:'waste_bags_out',     n:'Bags removed to store', u:'bags'},
 {c:'waste_collections',  n:'Contractor collections',u:'trips'},
 {c:'waste_recycling_bags',n:'Recycling bags',       u:'bags'},
 {c:'sanitary_bins_serviced',n:'Sanitary bins serviced',u:'bins'},
 {c:'water_m3',   n:'Water consumed',      u:'m³',   meter:true},
 {c:'elec_kwh',   n:'Electricity consumed',u:'kWh',  meter:true},
 {c:'solar_kwh',  n:'Solar generated',     u:'kWh',  meter:true},
 {c:'gen_hours',  n:'Generator run hours', u:'hrs',  meter:true},
 {c:'gen_fuel_l', n:'Generator fuel added',u:'L'},
 {c:'garden_rounds',n:'Grounds rounds done',u:'rounds'},
 {c:'occupancy_headcount',n:'People on site',u:'people'},
 {c:'air_pm25',   n:'PM2.5',               u:'µg/m³',limit:25}
];

/* ---------- state ---------- */
let S = {
  items:   store.get('broll.items', null),
  txns:    store.get('broll.txns', []),
  rounds:  store.get('broll.rounds', []),
  readings:store.get('broll.readings', []),
  cfg:     store.get('broll.cfg', {user:'Ruth Nakimuli', scope:'Cleaning · Toiletries',
             theme:'light', server:'', token:'', online:true})
};
if(!S.items){
  S.items = SEED_ITEMS.map(i=>({code:i.c,name:i.n,uom:i.u,opening:i.b,min:i.min}));
  // opening balances become real receipts, so the ledger explains every unit
  S.txns = S.items.filter(i=>i.opening>0).map(i=>({
    id:uid(), ts:new Date(Date.now()-86400000).toISOString(), item:i.code, dir:'IN',
    qty:i.opening, note:'Opening balance carried from the stock cards', who:'system', synced:true
  }));
  save();
}
function save(){ store.set('broll.items',S.items); store.set('broll.txns',S.txns);
  store.set('broll.rounds',S.rounds); store.set('broll.readings',S.readings); store.set('broll.cfg',S.cfg); }

/* ---------- the one rule that matters: balance is DERIVED ---------- */
function balance(code){
  return S.txns.filter(t=>t.item===code)
    .reduce((n,t)=> n + (t.dir==='OUT' ? -Number(t.qty) : Number(t.qty)), 0);
}
function movedToday(code,dir){
  const d=dstr(now());
  return S.txns.filter(t=>t.item===code && t.dir===dir && dstr(t.ts)===d)
               .reduce((n,t)=>n+Number(t.qty),0);
}
function avgDaily(code){
  const outs=S.txns.filter(t=>t.item===code && t.dir==='OUT');
  if(!outs.length) return 0;
  const days=new Set(outs.map(t=>dstr(t.ts))).size || 1;
  return outs.reduce((n,t)=>n+Number(t.qty),0)/days;
}
function itemStatus(it){
  const b=balance(it.code), a=avgDaily(it.code);
  const cover = a>0 ? b/a : null;
  if(b<=0) return {cls:'crit',word:'Out of stock',cover};
  if(b<=it.min) return {cls:'crit',word:'At minimum',cover};
  if(cover!=null && cover<7) return {cls:'warn',word:'Low',cover};
  return {cls:'ok',word:'OK',cover};
}
function addTxn(code,dir,qty,note){
  const t={id:uid(),ts:now(),item:code,dir,qty:Number(qty),note:note||'',
           who:S.cfg.user,synced:false};
  S.txns.push(t); save(); return t;
}

/* ---------- ui plumbing ---------- */
let stack=[], cur='home', ctx={};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),2400);}
function go(id,c,push=true){
  if(push && cur!==id) stack.push({id:cur,ctx});
  cur=id; ctx=c||{};
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $('#s-'+id).classList.add('on');
  $('#back').hidden = stack.length===0;
  document.querySelectorAll('nav.tabbar button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.tab===id));
  render(); $('#main').scrollTop=0;
}
$('#back').addEventListener('click',()=>{const p=stack.pop(); if(p) go(p.id,p.ctx,false); else go('home',{},false);});
document.querySelectorAll('nav.tabbar button').forEach(b=>
  b.addEventListener('click',()=>{stack=[];go(b.dataset.tab,{},false);}));
$('#net').addEventListener('click',()=>{
  S.cfg.online=!S.cfg.online; save();
  const n=$('#net'); n.textContent=S.cfg.online?'ONLINE':'OFFLINE'; n.classList.toggle('off',!S.cfg.online);
  toast(S.cfg.online?'Back online. Queued entries will sync.':'Offline. Entries are kept on this phone.');
  render();
});
$('#themebtn').addEventListener('click',()=>{
  S.cfg.theme = S.cfg.theme==='dark'?'light':'dark'; save(); applyTheme();
});
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.cfg.theme==='dark'?'dark':'light');
  document.querySelector('meta[name=theme-color]').setAttribute('content',
    S.cfg.theme==='dark'?'#0C1416':'#1B5163');
}

/* ---------- screens ---------- */
function render(){
  $('#sub').textContent = S.cfg.user + ' · ' + S.cfg.scope;
  const R={home:vHome,stock:vStock,item:vItem,move:vMove,rounds:vRounds,round:vRound,

function vRound(){
  const def=SEED_ROUNDS.find(r=>r.c===ctx.code); if(!def) return go('rounds',{},false);
  $('#title').firstChild.textContent=def.n;
  if(!ctx.state) ctx.state=def.list.map(l=>({...l,done:false,at:null}));
  const st=ctx.state, doneN=st.filter(x=>x.done).length;
  $('#s-round').innerHTML=`
  <p class="sub">Tap each line as you finish it. The time is recorded for you.</p>
  <div class="card">${st.map((l,ix)=>`
    <div class="chk ${l.done?'done':''}" data-chk="${ix}">
      <span class="box">✓</span>
      <span class="txt">${esc(l.t)}
        ${l.use?`<small>issues ${l.q} ${itemUom(l.use)} of ${esc(itemName(l.use))}</small>`:''}
        ${l.read?`<small>records a ${esc(metricName(l.read))} reading</small>`:''}
        ${l.at?`<small>done ${hhmm(l.at)}</small>`:''}</span>
    </div>`).join('')}</div>
  <p class="lbl">Condition score</p>
  <div class="pad" style="grid-template-columns:repeat(5,1fr)">
    ${[1,2,3,4,5].map(n=>`<button data-score="${n}" style="${ctx.score==n?'background:var(--accent-soft);border-color:var(--accent)':''}">${n}</button>`).join('')}
  </div>

    <textarea id="issue" placeholder="e.g. Cistern leaking in cubicle 3">${esc(ctx.issue||'')}</textarea></div>
  <button class="btn" id="finish">Complete round · ${doneN}/${st.length} ticked</button>
  <button class="btn sec" data-back="1">Cancel</button>`;
  document.querySelectorAll('#s-round .chk').forEach(el=>el.addEventListener('click',()=>{
    const l=st[+el.dataset.chk];
    l.done=!l.done; l.at=l.done?now():null;
    if(l.done && l.use){
      const q=prompt(`How many ${itemUom(l.use)} of ${itemName(l.use)} did you use?`, l.q);
      if(q!==null && parseFloat(q)>0){
        addTxn(l.use,'OUT',parseFloat(q),`${def.n} — ${l.t}`);
        l.qty=parseFloat(q);
        toast(`Issued ${q} ${itemUom(l.use)}. ${nf(balance(l.use),1)} left.`);
      } else { l.qty=0; }
    }
    if(l.done && l.read){
      const v=prompt(`${metricName(l.read)} reading (${metricUom(l.read)})`);
      if(v!==null && v!=='' && !isNaN(parseFloat(v))){
        S.readings.push({id:uid(),ts:now(),metric:l.read,value:parseFloat(v),who:S.cfg.user,synced:false});
        save(); toast('Reading saved.');
      }
    }
    vRound();
  }));
  document.querySelectorAll('#s-round [data-score]').forEach(b=>
    b.addEventListener('click',()=>{ctx.score=+b.dataset.score;vRound();}));
  $('#issue').addEventListener('input',e=>ctx.issue=e.target.value);
  $('#finish').addEventListener('click',()=>{
    S.rounds.push({id:uid(),ts:now(),code:def.c,done:doneN,total:st.length,
      score:ctx.score||null,issue:($('#issue').value||'').trim()||null,
      lines:st.map(l=>({t:l.t,done:l.done,at:l.at,qty:l.qty||null})),
      who:S.cfg.user,synced:false});
    save();
    toast(`Round recorded. ${doneN} of ${st.length} lines done.`);
    stack=[]; go('rounds',{},false);
  });
  wire();
}

function vUsage(){
  $('#title').firstChild.textContent='Usage';
  const g=ctx.gran||'day';
  const bkt=t=>{const d=new Date(t);
    if(g==='day') return dstr(t);
    if(g==='week'){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dstr(x);}
    return dstr(t).slice(0,7);};
  // consumption per item
  const per={}; S.txns.filter(t=>t.dir==='OUT').forEach(t=>{per[t.item]=(per[t.item]||0)+Number(t.qty);});
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=top.length?top[0][1]:1;
  // series over time
  const ser={}; S.txns.filter(t=>t.dir==='OUT').forEach(t=>{const k=bkt(t.ts);ser[k]=(ser[k]||0)+Number(t.qty);});
  const pts=Object.entries(ser).sort();
  // metric totals
  // A meter reading is a dial position, NOT a quantity. Consumption is the
  // difference between readings, so sum the deltas and ignore the baseline.
  // Adding 1,420 m3 of meter position to 48 m3 of usage is how a utilities
  // report ends up claiming the site drank a reservoir.
  const mt={};
  S.readings.forEach(r=>{
    const m=SEED_METRICS.find(x=>x.c===r.metric)||{};
    if(m.meter){ if(r.delta!=null && r.delta>0) mt[r.metric]=(mt[r.metric]||0)+r.delta; }
    else mt[r.metric]=(mt[r.metric]||0)+r.value;
  });
  const mLatest={}; S.readings.forEach(r=>{mLatest[r.metric]=r;});
  $('#s-usage').innerHTML=`
  <h2>What has been used</h2><p class="sub">Built from the same movements you record — nothing separate to fill in.</p>
  <div class="seg">${['day','week','month'].map(x=>
    `<button data-gran="${x}" aria-pressed="${g===x}">${x}</button>`).join('')}</div>
  ${pts.length?`<div class="card"><div class="row"><span class="mut">Issued per ${g}</span>
     <b>${nf(pts.reduce((n,p)=>n+p[1],0),1)} total</b></div>${spark(pts)}</div>`:''}
  <p class="lbl">Consumables issued</p>
  <div class="card">${top.length?`<div class="bars">${top.map(([c,v])=>`
    <div class="barrow"><span class="k">${esc(itemName(c))}</span><span class="v">${nf(v,1)} ${itemUom(c)}</span>
      <span class="t"><i style="width:${Math.max(3,100*v/max)}%"></i></span></div>`).join('')}</div>`
    :'<div class="empty">Nothing issued yet. Record an issue in the Store, or tick a restock line on a round.</div>'}</div>
  <p class="lbl">Utilities and measurements</p>
  <div class="card">${Object.keys(mLatest).length?Object.keys(mLatest).map(c=>{
      const m=SEED_METRICS.find(x=>x.c===c)||{};
      const used=mt[c];
      return `<div class="row"><span>${esc(metricName(c))}${m.meter?'<br><span class="mut" style="font-size:.68rem">meter now '+nf(mLatest[c].value,1)+' '+m.u+'</span>':''}</span>
        <b>${used==null?'<span class="mut" style="font-weight:400">baseline set</span>':nf(used,1)+' '+metricUom(c)}</b></div>`;
    }).join('')
    :'<div class="empty">No readings yet. Log water, electricity or waste from the Readings screen.</div>'}</div>
  <p class="note">Water usage appears here as soon as you log two meter readings —<br>consumption is the difference between them.</p>`;
  document.querySelectorAll('#s-usage [data-gran]').forEach(b=>
    b.addEventListener('click',()=>{ctx.gran=b.dataset.gran;vUsage();}));
  wire();
}
function spark(pts){
  const W=320,H=56,m=4;
  const max=Math.max(...pts.map(p=>p[1]))||1;
  const x=i=>m+(pts.length<2?W/2:i*(W-2*m)/(pts.length-1));
  const y=v=>H-m-(v/max)*(H-2*m);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Issued over time">
    <path d="${d}L${x(pts.length-1).toFixed(1)},${H-m}L${x(0).toFixed(1)},${H-m}Z" fill="var(--accent)" opacity=".14"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1][1]).toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

  <p class="lbl">Server</p>
  <div class="field"><label>API address</label>
    <input id="srv" value="${esc(S.cfg.server)}" placeholder="https://your-server/rest"></div>
  <div class="field"><label>Access token</label>
    <input id="tok" value="${esc(S.cfg.token)}" placeholder="paste the token" type="password"></div>
  <button class="btn sec" id="savecfg">Save server settings</button>
  <p class="lbl">This device</p>
  <div class="field"><label>Your name</label><input id="who" value="${esc(S.cfg.user)}"></div>
  <div class="field"><label>Service lines you cover</label><input id="scope" value="${esc(S.cfg.scope)}"></div>
  <button class="btn sec" id="saveme">Save</button>
  <p class="lbl">Data</p>
  <button class="btn sec" id="exp">Export everything as a file</button>
  <button class="btn danger" id="reset">Reset to opening balances</button>
  <p class="note">With no server set, everything stays on this phone and nothing is lost.<br>
  Add the address later and the queue sends itself.</p>`;
  $('#sync').addEventListener('click',doSync);
  $('#savecfg').addEventListener('click',()=>{S.cfg.server=$('#srv').value.trim();S.cfg.token=$('#tok').value.trim();save();toast('Server settings saved.');});
  $('#saveme').addEventListener('click',()=>{S.cfg.user=$('#who').value.trim()||'Unnamed';S.cfg.scope=$('#scope').value.trim();save();render();toast('Saved.');});
  $('#exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({items:S.items,txns:S.txns,rounds:S.rounds,readings:S.readings},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='broll-capture-'+dstr(now())+'.json';a.click();
    toast('Exported. Send it to yourself or import it into the system.');
  });
  $('#reset').addEventListener('click',()=>{
    if(!confirm('Delete every movement, round and reading on this phone and start again?')) return;
    try{['items','txns','rounds','readings'].forEach(k=>localStorage.removeItem('broll.'+k));}catch(e){}
    location.reload();
  });
  wire();
}

async function doSync(){
  const p=pending();
  if(!p) return toast('Nothing waiting.');
  if(!S.cfg.online) return toast('Offline. Nothing is lost — it is all on this phone.');
  if(!S.cfg.server){
    // no server yet: mark as sent locally so the demo reads true, and say so plainly
    S.txns.forEach(t=>t.synced=true); S.rounds.forEach(r=>r.synced=true); S.readings.forEach(r=>r.synced=true);
    save(); render();
    return toast(`${p} entries cleared locally. Set a server address to send them for real.`);
  }
  toast('Sending…');
  const H={'Content-Type':'application/json',Authorization:'Bearer '+S.cfg.token,
           Prefer:'resolution=ignore-duplicates'};
  let sent=0, failed=0;
  const post=async(path,body,mark)=>{
    try{ const r=await fetch(S.cfg.server.replace(/\/$/,'')+path,{method:'POST',headers:H,body:JSON.stringify(body)});
      if(r.ok||r.status===409){mark();sent++;} else failed++;
    }catch(e){failed++;}
  };
  for(const t of S.txns.filter(x=>!x.synced))
    await post('/stock_txn',{client_uuid:t.id,txn_ts:t.ts,direction:t.dir,qty:t.qty,
      note:t.note,source:'scan'},()=>t.synced=true);
  for(const r of S.rounds.filter(x=>!x.synced))
    await post('/task_log',{client_uuid:r.id,done_ts:r.ts,was_scanned:true,
      condition_score:r.score,issue_found:r.issue,source:'scan'},()=>r.synced=true);
  for(const r of S.readings.filter(x=>!x.synced))
    await post('/reading',{client_uuid:r.id,read_ts:r.ts,value:r.value,
      note:r.note,source:'manual'},()=>r.synced=true);
  save(); render();
  toast(failed?`${sent} sent, ${failed} could not send — they stay queued.`:`${sent} entries synced. No duplicates.`);
}

/* delegated click wiring for the generated markup */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>go('item',{code:b.dataset.item}));
  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>go('move',{code:ctx.code,dir:b.dataset.move}));
  document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>go('round',{code:b.dataset.round}));
  document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>go('reading',{metric:b.dataset.metric}));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{const p=stack.pop();p?go(p.id,p.ctx,false):go('home',{},false);});
}

/* boot */
applyTheme();
$('#net').textContent=S.cfg.online?'ONLINE':'OFFLINE';
$('#net').classList.toggle('off',!S.cfg.online);
window.addEventListener('online',()=>{S.cfg.online=true;save();$('#net').textContent='ONLINE';$('#net').classList.remove('off');});
render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{/* file:// or no HTTPS — app still works */});
}
</script>
</body>
</html>
